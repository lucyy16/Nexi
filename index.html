<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nexi AI">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/00d4ff/ffffff?text=Nexi">
    
    <title>Nexi AI - Elite Banking</title>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="config.js"></script>

    <style>
        :root { 
            --accent: #00d4ff; --safe: #a855f7; --error: #ff3b30; 
            --glass: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0; height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; 
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden;
        }
        
        /* Panel de Ajustes */
        .config-icon { position: absolute; top: 30px; right: 30px; font-size: 24px; cursor: pointer; z-index: 200; opacity: 0.7; }
        #config-panel {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 150;
            display: flex; flex-direction: column; align-items: center;
            padding-top: 50px; transition: 0.5s; backdrop-filter: blur(20px);
        }
        #config-panel.open { right: 0; }

        input {
            padding: 14px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--glass); color: white; margin: 8px 0; width: 85%; max-width: 350px;
            box-sizing: border-box; font-size: 16px;
        }

        /* Tarjetas Visuales */
        .cards-container { display: flex; gap: 15px; width: 100%; max-width: 500px; padding: 20px; overflow-x: auto; scrollbar-width: none; }
        .card {
            min-width: 200px; height: 110px; background: var(--glass);
            padding: 20px; border-radius: 24px; border: 1px solid var(--border);
            transition: 0.4s; display: flex; flex-direction: column; justify-content: space-between;
        }
        .card.active { border-color: var(--accent); background: rgba(0, 212, 255, 0.1); box-shadow: 0 0 20px rgba(0, 212, 255, 0.2); }

        /* Orbe Nexi */
        .siri-orb {
            width: 140px; height: 140px; border-radius: 50%;
            background: radial-gradient(circle at center, var(--accent), #0052d4, transparent);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.1); margin: 30px 0;
            transition: 0.5s; opacity: 0.5;
        }
        .speaking { transform: scale(1.1); opacity: 1; box-shadow: 0 0 60px var(--accent); animation: pulse 1s infinite; }
        .listening { background: radial-gradient(circle at center, var(--safe), #6a11cb, transparent); opacity: 1; box-shadow: 0 0 40px var(--safe); }
        
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        #status { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; height: 20px; }
        .btn-ios { 
            padding: 16px 45px; background: white; color: black; border: none; 
            border-radius: 30px; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        
        /* Agenda */
        .agenda-view { width: 85%; max-width: 350px; background: var(--glass); border-radius: 12px; margin-top: 10px; max-height: 150px; overflow-y: auto; }
        .agenda-item { padding: 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 14px; }
    </style>
</head>
<body>

    <div class="config-icon" onclick="toggleConfig()">⚙️</div>

    <div id="config-panel">
        <h2 style="color: var(--accent)">Ajustes de Nexi</h2>
        <label>Tu Nombre</label>
        <input type="text" id="username">
        <label>PIN de Seguridad</label>
        <input type="password" id="userpin">
        
        <h3 style="margin-top:20px">Agenda</h3>
        <input type="text" id="contactName" placeholder="Nombre Contacto">
        <input type="email" id="contactEmail" placeholder="Correo">
        <button class="btn-ios" onclick="agregarContacto()" style="padding: 10px 20px; font-size: 12px;">Añadir Contacto</button>
        
        <div class="agenda-view" id="agenda-list"></div>
        <button class="btn-ios" onclick="guardarTodo()" style="margin-top: 30px; background: var(--accent); color: white;">Guardar y Cerrar</button>
    </div>

    <div class="cards-container" id="cards-display"></div>
    <div id="orb" class="siri-orb"></div>
    <div id="status">SISTEMA EN ESPERA</div>
    <button id="btnStart" class="btn-main btn-ios" onclick="iniciarAsistente()">ACTIVAR NEXI</button>

    <script>
        // --- VARIABLES DE ESTADO ---
        let user = localStorage.getItem('nx_user') || "Usuario";
        let pin = localStorage.getItem('nx_pin') || "1234";
        let cards = JSON.parse(localStorage.getItem('nx_cards')) || [
            { id: 0, nombre: "Visa Signature", saldo: 15000 },
            { id: 1, nombre: "Cuenta Ahorro", saldo: 4500 }
        ];
        let agenda = JSON.parse(localStorage.getItem('nx_agenda')) || [];
        
        let cardActiva = 0, isSpeaking = false, estado = "esperando_activacion";
        let destinoP = null, montoP = 0;

        // --- RENDERIZADO DE UI ---
        function renderUI() {
            document.getElementById('cards-display').innerHTML = cards.map((c, i) => `
                <div class="card ${cardActiva === i ? 'active' : ''}" onclick="cardActiva=${i}; renderUI();">
                    <div style="font-size: 10px; color: var(--accent); font-weight: 700;">${c.nombre}</div>
                    <div style="font-size: 24px; font-weight: 200;">$${c.saldo.toLocaleString()}</div>
                </div>
            `).join('');
            
            document.getElementById('agenda-list').innerHTML = agenda.map((c, i) => `
                <div class="agenda-item">
                    <span>${c.nombre}</span>
                    <span onclick="borrarContacto(${i})" style="color:var(--error); cursor:pointer">✕</span>
                </div>
            `).join('');
            
            document.getElementById('username').value = user;
            document.getElementById('userpin').value = pin;
        }
        renderUI();

        // --- FUNCIONES DE AJUSTES ---
        function toggleConfig() { document.getElementById('config-panel').classList.toggle('open'); }
        
        function agregarContacto() {
            const n = document.getElementById('contactName').value;
            const e = document.getElementById('contactEmail').value;
            if(n && e) {
                agenda.push({ nombre: n, email: e });
                localStorage.setItem('nx_agenda', JSON.stringify(agenda));
                renderUI();
                document.getElementById('contactName').value = ""; document.getElementById('contactEmail').value = "";
            }
        }

        function borrarContacto(i) {
            agenda.splice(i, 1);
            localStorage.setItem('nx_agenda', JSON.stringify(agenda));
            renderUI();
        }

        function guardarTodo() {
            user = document.getElementById('username').value || user;
            pin = document.getElementById('userpin').value || pin;
            localStorage.setItem('nx_user', user);
            localStorage.setItem('nx_pin', pin);
            toggleConfig();
            hablar(`Configuración actualizada, ${user}.`);
        }

        // --- MOTOR DE VOZ (OPTIMIZADO PARA MÓVIL) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'es-MX';
        recognition.continuous = false;

        function hablar(t) {
            isSpeaking = true;
            recognition.stop();
            window.speechSynthesis.cancel();
            const m = new SpeechSynthesisUtterance(t);
            m.lang = 'es-MX';
            m.onstart = () => { document.getElementById('orb').className = 'siri-orb speaking'; };
            m.onend = () => {
                document.getElementById('orb').className = 'siri-orb listening';
                isSpeaking = false;
                // Pequeño delay de 300ms para que el hardware del móvil reaccione
                setTimeout(() => { if(!isSpeaking) try { recognition.start(); } catch(e){} }, 300);
            };
            window.speechSynthesis.speak(m);
        }

        recognition.onresult = (e) => {
            const voz = e.results[0][0].transcript.toLowerCase();
            document.getElementById('status').innerText = voz;

            // CANCELACIÓN UNIVERSAL
            if (voz.includes("cancelar operación") || voz.includes("cancelar operacion")) {
                estado = "esperando_activacion";
                hablar("De acuerdo, he cancelado el proceso.");
                return;
            }

            // LÓGICA DE FLUJO
            if (estado === "esperando_activacion") {
                if (voz.includes("nexi")) {
                    estado = "reposo";
                    hablar(`Dime ${user}, ¿qué movimiento bancario haremos?`);
                }
            } else if (estado === "reposo") {
                if (voz.includes("transferencia") || voz.includes("enviar") || voz.includes("depositar")) {
                    estado = "buscando_contacto";
                    hablar("¿A quién de tu agenda le enviamos dinero?");
                }
            } else if (estado === "buscando_contacto") {
                const contacto = agenda.find(c => voz.includes(c.nombre.toLowerCase()));
                if (contacto) {
                    destinoP = contacto;
                    estado = "pidiendo_monto";
                    hablar(`Entendido. ¿Qué cantidad quieres enviarle a ${destinoP.nombre}?`);
                } else {
                    hablar("No encontré a esa persona. ¿A quién se lo envío?");
                }
            } else if (estado === "pidiendo_monto") {
                const num = voz.match(/\d+/);
                if (num) {
                    montoP = parseInt(num[0]);
                    if (cards[cardActiva].saldo >= montoP) {
                        estado = "confirmando_pin";
                        hablar(`Dime tu PIN para autorizar los ${montoP} pesos.`);
                    } else {
                        estado = "esperando_activacion";
                        hablar("No tienes saldo suficiente en esta tarjeta.");
                    }
                }
            } else if (estado === "confirmando_pin") {
                if (voz.replace(/\s/g, "").includes(pin)) {
                    cards[cardActiva].saldo -= montoP;
                    localStorage.setItem('nx_cards', JSON.stringify(cards));
                    estado = "esperando_activacion";
                    renderUI();
                    hablar(`Éxito, ${user}. Transferencia realizada a ${destinoP.nombre}. Tu nuevo saldo es de ${cards[cardActiva].saldo} pesos.`);
                } else {
                    hablar("PIN incorrecto. Repítelo o di cancelar operación.");
                }
            }
        };

        recognition.onend = () => { if(!isSpeaking) try { recognition.start(); } catch(e){} };

        function iniciarAsistente() {
            document.getElementById('btnStart').style.display = 'none';
            estado = "esperando_activacion";
            hablar(`Hola ${user}. Sistema Nexi activado.`);
        }
    </script>
</body>
</html>
