<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nexi AI">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/00d4ff/ffffff?text=Nexi">
    <title>Nexi AI - Elite Banking</title>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="config.js"></script>

    <style>
        :root { --accent: #00d4ff; --bg: #050505; --error: #ff3b30; --violet: #a855f7; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
        
        /* Panel Lateral */
        #config-btn { position: absolute; top: 20px; right: 20px; font-size: 28px; cursor: pointer; z-index: 100; opacity: 0.8; }
        #config-panel { position: fixed; top: 0; right: -350px; width: 310px; height: 100%; background: #111; padding: 25px; transition: 0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67); box-shadow: -10px 0 30px rgba(0,0,0,0.8); z-index: 200; overflow-y: auto; }
        #config-panel.open { right: 0; }

        label { font-size: 11px; color: #666; text-transform: uppercase; margin-top: 15px; display: block; letter-spacing: 1px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; font-size: 16px; }

        /* Tarjetas */
        .cards-container { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; padding: 0 10px; }
        .card { width: 170px; height: 95px; background: linear-gradient(135deg, #1a1a1a, #000); border: 2px solid #333; border-radius: 14px; padding: 15px; cursor: pointer; transition: 0.3s; }
        .card.active { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); transform: translateY(-3px); }
        .card-type { font-size: 9px; color: var(--accent); font-weight: bold; text-transform: uppercase; }
        .card-balance { font-size: 20px; margin-top: 8px; font-weight: 300; }

        /* Orbe Nexi */
        .orb-wrapper { position: relative; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
        .orb { width: 95px; height: 95px; background: radial-gradient(circle, var(--accent), transparent 70%); border-radius: 50%; transition: 0.5s; opacity: 0.4; }
        .speaking { transform: scale(1.3); opacity: 1; box-shadow: 0 0 50px var(--accent); }
        .listening { background: radial-gradient(circle, var(--violet), transparent 70%); opacity: 1; box-shadow: 0 0 40px var(--violet); animation: breath 2s infinite; }
        .cancel-flash { background: radial-gradient(circle, var(--error), transparent 70%) !important; box-shadow: 0 0 60px var(--error) !important; }

        @keyframes breath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        #status { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 2px; margin-top: 25px; text-align: center; height: 30px; }
        .btn-main { padding: 16px 45px; border-radius: 35px; border: none; background: white; color: black; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s; box-shadow: 0 4px 15px rgba(255,255,255,0.1); }
        
        .agenda-item { font-size: 13px; padding: 10px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div id="config-btn" onclick="toggleConfig()">⚙️</div>

    <div id="config-panel">
        <h3>Ajustes de Nexi</h3>
        <label>Nombre del Usuario</label>
        <input type="text" id="userNameInput">
        <label>Saldo Tarjeta 1</label>
        <input type="number" id="saldo1Input">
        <label>Saldo Tarjeta 2</label>
        <input type="number" id="saldo2Input">
        <label>PIN de Seguridad</label>
        <input type="password" id="pinInput">

        <h3>Agenda Nexi</h3>
        <input type="text" id="newContactName" placeholder="Nombre (ej: Carlos)">
        <input type="email" id="newContactEmail" placeholder="Correo electrónico">
        <button onclick="agregarContacto()" style="width:100%; padding:10px; background:var(--accent); border:none; border-radius:8px; margin-top:5px; color:black; font-weight:bold;">+ GUARDAR CONTACTO</button>
        <div id="agendaDisplay" style="margin-top:15px; background:rgba(0,0,0,0.3); border-radius:8px;"></div>

        <button class="btn-main" onclick="guardarConfig()" style="width: 100%; margin-top: 30px; background:white;">APLICAR CAMBIOS</button>
    </div>

    <div class="cards-container" id="cardsDisplay"></div>

    <div class="orb-wrapper"><div id="orb" class="orb"></div></div>
    
    <div id="status">TOCA PARA INICIAR</div>
    <button id="startBtn" class="btn-main" onclick="iniciarAsistente()">ACTIVAR NEXI</button>

    <script>
        // --- INICIALIZACIÓN DE DATOS ---
        let config = JSON.parse(localStorage.get('nx_v6_cfg')) || { nombre: "Usuario", pin: "1234" };
        let tarjetas = JSON.parse(localStorage.get('nx_v6_tj')) || [{id:0, nombre:"Visa Platinum", saldo:5000}, {id:1, nombre:"Nexus Gold", saldo:2000}];
        let agenda = JSON.parse(localStorage.get('nx_v6_ag')) || [];
        
        let tSel = 0, estado = "bloqueado", montoP = 0, destinoP = null, isSpeaking = false;

        // --- COMPATIBILIDAD DE RECONOCIMIENTO ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'es-MX';
        recognition.continuous = false;
        recognition.interimResults = false;

        function renderUI() {
            document.getElementById('cardsDisplay').innerHTML = tarjetas.map(t => `
                <div class="card ${tSel === t.id ? 'active' : ''}" onclick="tSel=${t.id}; renderUI();">
                    <div class="card-type">${t.nombre}</div>
                    <div class="card-balance">$${t.saldo.toLocaleString()}</div>
                </div>`).join('');
            document.getElementById('agendaDisplay').innerHTML = agenda.map((c, i) => `
                <div class="agenda-item"><span>${c.nombre}</span><span onclick="eliminarContacto(${i})" style="color:var(--error);cursor:pointer">✕</span></div>`).join('');
            document.getElementById('userNameInput').value = config.nombre;
            document.getElementById('pinInput').value = config.pin;
            document.getElementById('saldo1Input').value = tarjetas[0].saldo;
            document.getElementById('saldo2Input').value = tarjetas[1].saldo;
        }
        renderUI();

        // --- FUNCIONES DE LÓGICA ---
        function toggleConfig() { document.getElementById('config-panel').classList.toggle('open'); }
        function agregarContacto() {
            const n = document.getElementById('newContactName').value, e = document.getElementById('newContactEmail').value;
            if(n && e) { agenda.push({nombre:n, email:e}); localStorage.setItem('nx_v6_ag', JSON.stringify(agenda)); renderUI(); }
        }
        function eliminarContacto(i) { agenda.splice(i,1); localStorage.setItem('nx_v6_ag', JSON.stringify(agenda)); renderUI(); }
        
        function guardarConfig() {
            config.nombre = document.getElementById('userNameInput').value;
            config.pin = document.getElementById('pinInput').value;
            tarjetas[0].saldo = parseFloat(document.getElementById('saldo1Input').value);
            tarjetas[1].saldo = parseFloat(document.getElementById('saldo2Input').value);
            localStorage.setItem('nx_v6_cfg', JSON.stringify(config));
            localStorage.setItem('nx_v6_tj', JSON.stringify(tarjetas));
            toggleConfig(); renderUI(); hablar("Todo actualizado.");
        }

        // --- EL MOTOR DE NEXI ---
        function hablar(t) {
            isSpeaking = true;
            recognition.stop();
            window.speechSynthesis.cancel();
            
            const m = new SpeechSynthesisUtterance(t);
            m.lang = 'es-MX';
            m.onstart = () => document.getElementById('orb').className = 'orb speaking';
            m.onend = () => {
                isSpeaking = false;
                document.getElementById('orb').className = 'orb listening';
                // Retraso clave para que el micrófono no falle en móviles
                setTimeout(() => { if(!isSpeaking) try { recognition.start(); } catch(e){} }, 350);
            };
            window.speechSynthesis.speak(m);
        }

        recognition.onresult = (e) => {
            const voz = e.results[0][0].transcript.toLowerCase();
            document.getElementById('status').innerText = "Voz: " + voz;

            // CANCELACIÓN POR VOZ
            if (voz.includes("cancelar operación") || voz.includes("cancelar operacion")) {
                estado = "esperando_nexi";
                document.getElementById('orb').className = 'orb cancel-flash';
                hablar("De acuerdo, he cancelado la operación actual.");
                return;
            }

            if (estado === "esperando_nexi") {
                if (voz.includes("nexi")) {
                    estado = "reposo";
                    hablar(`Hola ${config.nombre}, te escucho. ¿Qué haremos hoy?`);
                }
            } else if (estado === "reposo") {
                if (voz.includes("transferencia") || voz.includes("enviar") || voz.includes("depositar")) {
                    estado = "buscando"; hablar("¿A quién de tu agenda enviamos?");
                }
            } else if (estado === "buscando") {
                const c = agenda.find(x => voz.includes(x.nombre.toLowerCase()));
                if (c) { destinoP = c; estado = "monto"; hablar(`Entendido. ¿Qué monto le enviamos a ${c.nombre}?`); }
                else { hablar("No encontré ese nombre. ¿A quién se lo envío?"); }
            } else if (estado === "monto") {
                const n = voz.match(/\d+/);
                if (n) {
                    montoP = parseInt(n[0]);
                    if (tarjetas[tSel].saldo >= montoP) { estado = "pin"; hablar(`Confirmado. Dime tu clave para autorizar.`); }
                    else { estado = "esperando_nexi"; hablar("Saldo insuficiente. Operación terminada."); }
                }
            } else if (estado === "pin") {
                if (voz.replace(/\s/g, "").includes(config.pin)) {
                    tarjetas[tSel].saldo -= montoP;
                    localStorage.setItem('nx_v6_tj', JSON.stringify(tarjetas));
                    estado = "esperando_nexi"; renderUI();
                    hablar(`Éxito. He enviado los fondos. Tu nuevo saldo es de ${tarjetas[tSel].saldo} pesos.`);
                } else { hablar("PIN incorrecto. Intenta de nuevo o di cancelar."); }
            }
        };

        // Mantener micro encendido si no está hablando
        recognition.onend = () => { if(!isSpeaking) try { recognition.start(); } catch(e){} };

        function iniciarAsistente() {
            document.getElementById('startBtn').style.display = 'none';
            estado = "esperando_nexi";
            document.getElementById('status').innerText = 'DI "NEXI" PARA DESPERTARME';
            hablar(`Sistema activado. Di mi nombre para empezar.`);
        }
    </script>
</body>
</html>
